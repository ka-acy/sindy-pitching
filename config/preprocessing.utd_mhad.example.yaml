dataset:
  name: utd_mhad
  raw_root: data/utd_mhad/raw
  processed_root: data/utd_mhad/processed
  index_csv: data/utd_mhad/metadata/index.csv
  proxy_subset_csv: data/utd_mhad/splits/proxy_subset.csv
  smoke_test_csv: data/utd_mhad/splits/smoke_test.csv

pose:
  primary_modality: skeleton
  center_joint: hip_center
  orientation_normalization: false
  target_joints:
    - head
    - neck
    - spine
    - left_shoulder
    - right_shoulder
    - left_elbow
    - right_elbow
    - left_wrist
    - right_wrist
    - left_hip
    - right_hip
    - left_knee
    - right_knee
    - left_ankle
    - right_ankle

preprocessing:
  trim_motion_windows: true
  interpolate_short_gaps: true
  max_gap_frames: 3
  smoothing:
    method: savgol
    window_length: 11
    polyorder: 3
  trim:
    energy_threshold_ratio: 0.2
    padding_frames: 4
    min_frames: 25
  scale_normalization: false

features:
  output_subdir: features
  angle_unwrap: true
  state_vector:
    - trunk_rotation_angle
    - shoulder_rotation_angle
    - hip_rotation_angle
    - hip_shoulder_separation_angle
    - trunk_forward_lean_angle
    - trunk_lateral_tilt_angle
    - right_elbow_flexion_angle
    - left_elbow_flexion_angle
    - right_wrist_speed
    - left_wrist_speed
  derivative:
    method: savgol_gradient
    window_length: 9
    polyorder: 3

modeling:
  input_feature_subdir: features
  results_root: results/equations
  polynomial_degree: 2
  include_bias: true
  include_interaction: true
  scale_features: true
  stlsq_threshold: 0.1
  stlsq_alpha: 0.05
  stlsq_max_iter: 20
  selection_metric: sparsity_weighted_r2
  complexity_penalty: 0.0005
  sweep:
    polynomial_degree: [1, 2]
    stlsq_threshold: [0.02, 0.05, 0.1, 0.2]
    stlsq_alpha: [0.001, 0.01, 0.05]

evaluation:
  feature_subdir: features
  model_results_root: results/equations
  evaluation_root: results/evaluation
  plot_root: results/plots
  reconstruction_frames: 40
  plot_feature_names:
    - trunk_rotation_angle
    - hip_shoulder_separation_angle
    - right_wrist_speed
  max_plot_trials_per_label: 1

logging:
  write_run_log: true
  log_dir: results/preprocessing_logs
